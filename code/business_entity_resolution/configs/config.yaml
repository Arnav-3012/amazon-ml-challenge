# Paths are relative to the repo root (= submission zip root).
seed: 42

blocking:
  df_cap: 1000          # token indexed iff df (S1+S2+S3, same country, same split) <= df_cap
  m: 5                  # record-centric: top-m S1 per S2/S3 record, per channel
  k: 10                 # S1-centric: top-k records per S1, per channel, per source (S2 and S3 separately)
  select: [X]           # channels whose m/k hits define the candidate set (others kept as features). X m5/k10:
                        # PC 96.31%, perfect-matcher F0.5 ceiling 0.9873 at 31.3 cand/S1 (knee of the budget curve)
  bigrams: true         # A and C: adjacent name-token bigrams ("a_b", skeleton bigrams in C) as extra tokens, same cap
  fallback_rarest: true # A and C: a record with no token under the cap keeps its 2 lowest-df linkable tokens
  sorted_bigrams: true  # bigram key in sorted order: an adjacent word swap gives the same key
  joined_name: true     # A: name with spaces removed as an extra token ("blairhawaii")
  composite: true       # X: "K|<name skel>|<addr skel>" pair tokens (name AND address conjunction)
  sweep_m: [1, 3, 5, 10]     # train only: ranks kept up to max(sweep_m) / max(sweep_k) for the budget curve
  sweep_k: [10, 30, 60]
  sweep_df_cap: [500, 1000, 5000]
  nnz_budget: 40000000  # max upper-bound nnz of one sparse product chunk (memory knob, not a result knob)
  s1_range: 100000      # S1 rows per merge slice

gate:                   # M5-1 blocking v2 (src.gate). m/k/select above stay the v1 definition (variant "v1")
  pool_k: 30            # pool = all channels, record-centric top-m U S1-centric top-pool_k; test grid is built at
                        # max(sweep_m) / pool_k, train reads blockgrid_train (m<=10, k<=60)
  sweep_m: [5, 10]
  sweep_n: [30, 35, 40, 45, 50, 60]
  buckets: 16           # S1 hash buckets per pass (memory knob, not a result knob)
  m: 10                 # CHOSEN after `src.gate --eval` (docs/blocking_v2.md); must be in sweep_m
  n: 60                 # per-S1 cap; must be <= max(sweep_n). Decided (docs/decisions_mistakes.md); n>60 gated on --preflight RSS
  sibling:
    enabled: false      # flip after reading docs/blocking_v2.md §sibling
    delta: null         # sib_margin to union at --apply time, once enabled
  variant: v1           # pre = order by pre-score; v1 = v1 set first, then pre-score
  sib_margin: [0.05, 0.1, 0.2]  # M5-1b src.sibling: anchor top1-top2 pre-score margin sweep (docs/blocking_v2.md §sibling)

cv_full:                # M5-2 (src.cv_full)
  drop_frac: 0.19       # S1-dropout: train 4.68 S2/S3 records per S1 / 0.81 = 5.78 = test density (5.75)
  inner_valid_frac: 0.1 # share of a fold's training S1s held out for early stopping
  curve_fracs: [0.2, 0.5]
  max_rss_mb: 20000     # stop if the process peak RSS passes this
  ext_neg_rate: 0.25    # Bernoulli keep-rate for extension-only (not in_v1) sampled negatives; weight = 1/(rate product)
  easy_neg_rate: 0.2    # Bernoulli keep-rate for non-hard negatives in fold training (weight 1/rate, x ext); hard = sample_rows' hardest-first set
  preflight_fracs: [0.05, 0.2]  # --preflight: one fold-0 point per S1 fraction, linear fit -> 100%
  preflight_rounds: 50  # fixed LightGBM rounds per preflight point

stage2:                 # M5-3 (src.stage2): stacked GBM on stage-1 OOF (b) p
  n_carry: 10           # strongest stage-1 features by summed fold gain (record-side REC_COLS excluded)
  coref_p: 0.8          # anchor = another record of the S1 with stage-1 p above this
  coref_sim: 90         # anchor supports the row when name_tset (or addr_tset) to it >= this
  max_anchors: 5        # top anchors by p per S1 (bounds record x record comparisons)
  pair_chunk: 5000000   # anchor pairs per token_set pass (memory knob)
  keep_gain: 0.002      # ship only if stage-2 OOF (b) >= stage-1 OOF (b) + this

features:
  chunk_rows: 2000000   # candidate pairs per pass-1 part (memory knob, not a result knob)

matcher:
  subset_fraction: 0.2  # iteration mode: first 20% of a seeded permutation of train S1 ids
  final_fraction: 0.5   # final fit: first 50% of the same permutation (nests the 20%); 1.0 = all
  n_folds: 5            # GroupKFold by s1_id
  neg_ratio: 3          # sampled negatives per positive in each training set
  hard_frac: 0.5        # share of sampled negatives taken hardest-first (max channel score); rest uniform
  num_boost_round: 5000
  early_stopping: 100   # rounds, on held-out fold log-loss (all its candidates)
  final_round_mult: 1.1 # final fit rounds = mean CV best iteration x this
  lgb:
    objective: binary
    learning_rate: 0.05
    num_leaves: 127
    min_data_in_leaf: 200
    feature_fraction: 0.8
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    max_bin: 255
    deterministic: true
    force_row_wise: true
    num_threads: 0
    verbose: -1

decide:
  t_grid: [0.02, 0.99, 0.01]  # np.arange(start, stop, step) thresholds on OOF p

paths:
  dataset_dir: dataset
  train_dir: dataset/train
  test_dir: dataset/test
  output_dir: output
  matching_results: output/matching_results.tsv
  candidate_pairs: output/candidate_pairs.tsv
  artifacts_dir: artifacts
  interim_dir: artifacts/interim
  features_dir: artifacts/features
  oof_dir: oof
  models_dir: models
  matcher_report: docs/matcher.md
  validator: utils/validate_submission.py
